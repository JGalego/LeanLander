name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify application version
        run: npm run version:check -- "${GITHUB_REF_NAME}"

      - name: Check frontend
        run: npm run check

      - name: Test native services
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib --locked

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise browser workflows
        run: npm run e2e

  build-release:
    name: Release ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.platform }}
    env:
      WINDOWS_SIGNING_ARGS: ''
      WINDOWS_SIGNING_CONFIGURED: ${{ secrets['WINDOWS_CERTIFICATE'] != '' && secrets['WINDOWS_CERTIFICATE_PASSWORD'] != '' && secrets['WINDOWS_TIMESTAMP_URL'] != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: ubuntu-22.04
            target: ''
            args: --ci --bundles appimage,deb
          - name: Windows x86_64
            platform: windows-latest
            target: ''
            args: --ci --bundles nsis,msi
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --ci --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --ci --target x86_64-apple-darwin --bundles dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: release-${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CONFIGURED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets['WINDOWS_CERTIFICATE'] }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets['WINDOWS_CERTIFICATE_PASSWORD'] }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets['WINDOWS_TIMESTAMP_URL'] }}
        run: |
          $ErrorActionPreference = 'Stop'
          $certificatePath = Join-Path $env:RUNNER_TEMP 'leanlander-signing.pfx'
          $configPath = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/tauri.windows-signing.json'
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
            )
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate `
              -FilePath $certificatePath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password
            if ([string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
              throw 'The imported Windows signing certificate has no thumbprint.'
            }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content $configPath
          "WINDOWS_SIGNING_ARGS=--config $configPath" >> $env:GITHUB_ENV

      - name: Build and upload release bundles
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_CERTIFICATE: ${{ secrets['APPLE_CERTIFICATE'] }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets['APPLE_CERTIFICATE_PASSWORD'] }}
          APPLE_ID: ${{ secrets['APPLE_ID'] }}
          APPLE_PASSWORD: ${{ secrets['APPLE_PASSWORD'] }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && (secrets['APPLE_SIGNING_IDENTITY'] || '-') || '' }}
          APPLE_TEAM_ID: ${{ secrets['APPLE_TEAM_ID'] }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }} ${{ env.WINDOWS_SIGNING_ARGS }}
          generateReleaseNotes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          releaseAssetNamePattern: LeanLander_[version]_[platform]_[arch][setup][ext]
          releaseBody: |
            Download the installer for your platform below.

            Verify downloads against SHA256SUMS.txt. Builds use platform signing and notarization when the repository signing secrets are configured; unsigned preview builds may display an unknown-publisher warning.
          releaseDraft: true
          releaseName: LeanLander ${{ github.ref_name }}
          retryAttempts: 2
          tagName: ${{ github.ref_name }}
          uploadUpdaterJson: false

  publish:
    name: Publish release
    needs: build-release
    runs-on: ubuntu-22.04

    steps:
      - name: Create checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir release-assets
          gh release download "${GITHUB_REF_NAME}" --dir release-assets
          cd release-assets
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --clobber

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false