<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">LeanLander</title><desc id="d">Two planes folded along a lit ridge.</desc>
  <defs>
  <linearGradient id="tile" x1="40" y1="0" x2="472" y2="512" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#14ab8b"/><stop offset=".52" stop-color="#08715e"/><stop offset="1" stop-color="#03443a"/>
  </linearGradient>
  <radialGradient id="glow" cx="196" cy="52" r="392" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/><stop offset=".42" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity=".22"/>
  </linearGradient>
  <linearGradient id="lit" x1="200" y1="110" x2="420" y2="400" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcece6"/>
  </linearGradient>
  <linearGradient id="shade" x1="110" y1="120" x2="290" y2="400" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#bcd5cd"/><stop offset="1" stop-color="#87ada2"/>
  </linearGradient>
  <clipPath id="tileclip"><rect width="512" height="512" rx="116"/></clipPath>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="15"/></filter>
</defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <g clip-path="url(#tileclip)"><g opacity=".34" filter="url(#soft)" transform="translate(0 18)"><path d="M118 358 232 146 398 358Z" fill="#02231d" stroke="#02231d" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/></g><path d="M232 146 118 358 258 358Z" fill="url(#shade)" stroke="url(#shade)" stroke-linejoin="round" stroke-width="26"/><path d="M232 146 258 358 398 358Z" fill="url(#lit)" stroke="url(#lit)" stroke-linejoin="round" stroke-width="26"/><path d="M232 156 256 346" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".92"/></g>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="url(#bevel)" stroke-width="3"/>
</svg>
