[package]
name = "leanlander"
version = "0.1.0"
description = "A focused desktop IDE for Lean 4"
authors = ["LeanLander contributors"]
license = "MIT"
repository = "https://github.com/JGalego/LeanLander"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "leanlander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = [
	"dep:tauri",
	"dep:tauri-plugin-dialog",
	"dep:tauri-plugin-log",
]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
url = "2.5"
log = "0.4"
tauri = { version = "2.11.3", optional = true }
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
